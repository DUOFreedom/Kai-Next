name: Pages Build and Deployment

on:
  push:
    branches:
      - main  # Adjust to your default branch
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build documentation
        run: mkdocs build -d _site_build

      - name: Validate site before deploy
        run: |
          echo "Checking critical files..."
          test -f _site_build/index.html || { echo "FATAL: Landing page missing"; exit 1; }
          test -d _site_build/docs || { echo "FATAL: Docs directory missing"; exit 1; }
          echo "All checks passed"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site_build
          enable_jekyll: false